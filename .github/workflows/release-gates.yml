name: release-gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-release-candidate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run advisories:check
      - run: npm run release:macos:unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-macos-package-structure-test
          path: artifacts/*-unsigned.pkg*
          if-no-files-found: error
          retention-days: 7
