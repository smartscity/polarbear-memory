name: release-gates

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run advisories:check

  release-metadata:
    name: Verify release tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify tag format
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the exact form vMAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "Release version: ${GITHUB_REF_NAME#v}"

  macos-release-candidate:
    needs: [checks, release-metadata]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          npm version "$VERSION" \
            --no-git-tag-version \
            --allow-same-version

          echo "package version: $(node -p "require('./package.json').version")"

      # package version 变了以后，SBOM 必须重新生成
      - name: Generate SBOM
        run: npm run sbom:generate

      - name: Build macOS unsigned package
        run: npm run release:macos:unsigned

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-macos-package-${{ github.ref_name }}
          path: artifacts/*-unsigned.pkg*
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: Publish npm
    needs: [checks, release-metadata, macos-release-candidate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org/

      - run: npm ci --ignore-scripts

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          npm version "$VERSION" \
            --no-git-tag-version \
            --allow-same-version

          echo "Publishing polarbear-memory@$VERSION"

      # npm publish 如果内部也会 sbom:check，这里同样需要
      - name: Generate SBOM
        run: npm run sbom:generate

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}